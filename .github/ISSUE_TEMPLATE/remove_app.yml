name: "Odstranění aplikace"
description: "Navrhni vyřazení nebo odstranění aplikace ze seznamu"
labels: ["remove-app"]
body:
  - type: input
    id: app_name
    attributes:
      label: "Název aplikace"
      description: "Jakou aplikaci chceš ze seznamu odebrat?"
      placeholder: "např. Immich"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Důvod odstranění"
      description: "Proč by měla být aplikace ze seznamu odstraněna?"
      placeholder: "např. Projekt byl autorem archivován a již není udržován, nebo přešel na uzavřený kód..."
    validations:
      required: true
  - type: input
    id: alternative
    attributes:
      label: "Doporučená alternativa (Volitelné)"
      description: "Existuje vhodná open-source náhrada nebo fork, který bychom měli zařadit místo ní?"
      placeholder: "např. https://github.com/..."
    validations:
      required: false
