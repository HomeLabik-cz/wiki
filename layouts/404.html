{{ define "main" }}
<div class="wiki-404-container">
  <div class="wiki-404-badge">404</div>

  <p class="wiki-404-desc">
    Omlouváme se, ale stránka, kterou hledáte, neexistuje, byla přesunuta nebo přejmenována.
  </p>
  <div class="wiki-404-actions">
    <a href="{{ "/" | relURL }}" class="btn-primary-wiki">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Úvodní stránka</span>
    </a>
    <a href="{{ "apps/" | relURL }}" class="btn-secondary-wiki">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      <span>Seznam aplikací</span>
    </a>
  </div>
</div>
{{ end }}
